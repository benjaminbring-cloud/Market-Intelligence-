# Who gets what. Add a team = add a block. Same pipeline, different lens + delivery.
# `lens` is injected into the scoring prompt so each team sees the same news through its own job.
delivery:
  from_name: "Sabio Market Intel"
  # transport: smtp | gmail | stdout  (set in env: MI_TRANSPORT)
profiles:
  ben:
    name: Ben Bring
    email: bbring@sabio.inc          # CONFIRM address
    cadence: daily                   # daily | weekly
    top_n: 7
    lens: >
      Ben leads client strategy. Surface what changes how we pitch, what we can
      activate on this week, and what belongs in the weekly client strategy decks.
    sections: [headline, activations, deck_slides, narrative_of_the_week, watchlist]
